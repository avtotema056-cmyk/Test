name: Deploy Child Theme
on:
  workflow_dispatch:
  push:
    branches: [claude/russian-language-y7kuv7]
    paths: ['themes/woodmart-child/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/russian-language-y7kuv7
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 176.124.212.75 >> ~/.ssh/known_hosts
      - name: Upload theme
        run: |
          scp -r themes/woodmart-child root@176.124.212.75:/var/www/fastuser/data/www/shopsmoking.ru/wp-content/themes/
      - name: Set permissions & activate
        run: |
          ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "
            chown -R fastuser:fastuser /var/www/fastuser/data/www/shopsmoking.ru/wp-content/themes/woodmart-child
            cd /var/www/fastuser/data/www/shopsmoking.ru
            wp theme activate woodmart-child --allow-root
            wp theme list --allow-root --fields=name,status | grep -E 'woodmart|Status'
          "
