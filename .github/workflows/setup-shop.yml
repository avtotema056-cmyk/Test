name: Setup ShopSmoking
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run: shopsmoking | seo | woodmart | fix | images | all'
        required: false
        default: 'woodmart'
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/russian-language-y7kuv7
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 176.124.212.75 >> ~/.ssh/known_hosts
      - name: Upload scripts
        run: |
          scp -i ~/.ssh/id_ed25519 .github/scripts/setup_shopsmoking.php root@176.124.212.75:/tmp/setup_shopsmoking.php
          scp -i ~/.ssh/id_ed25519 .github/scripts/setup_seo.php root@176.124.212.75:/tmp/setup_seo.php
          scp -i ~/.ssh/id_ed25519 .github/scripts/setup_woodmart.php root@176.124.212.75:/tmp/setup_woodmart.php
      - name: Run shopsmoking setup
        if: ${{ inputs.script == 'shopsmoking' || inputs.script == 'all' }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "cd /var/www/fastuser/data/www/shopsmoking.ru && wp eval-file /tmp/setup_shopsmoking.php --allow-root"
      - name: Run SEO setup
        if: ${{ inputs.script == 'seo' || inputs.script == 'all' }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "cd /var/www/fastuser/data/www/shopsmoking.ru && wp eval-file /tmp/setup_seo.php --allow-root"
      - name: Run WoodMart setup
        if: ${{ inputs.script == 'woodmart' || inputs.script == 'all' }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "cd /var/www/fastuser/data/www/shopsmoking.ru && wp eval-file /tmp/setup_woodmart.php --allow-root"
      - name: Upload fix script
        if: ${{ inputs.script == 'fix' || inputs.script == 'all' }}
        run: scp -i ~/.ssh/id_ed25519 .github/scripts/setup_fix.php root@176.124.212.75:/tmp/setup_fix.php
      - name: Run fix script
        if: ${{ inputs.script == 'fix' || inputs.script == 'all' }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "cd /var/www/fastuser/data/www/shopsmoking.ru && wp eval-file /tmp/setup_fix.php --allow-root"
      - name: Upload images script
        if: ${{ inputs.script == 'images' || inputs.script == 'all' }}
        run: scp -i ~/.ssh/id_ed25519 .github/scripts/setup_images.php root@176.124.212.75:/tmp/setup_images.php
      - name: Run images import
        if: ${{ inputs.script == 'images' || inputs.script == 'all' }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "cd /var/www/fastuser/data/www/shopsmoking.ru && wp eval-file /tmp/setup_images.php --allow-root"
