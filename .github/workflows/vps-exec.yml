name: VPS Execute

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on VPS'
        required: true
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H 176.124.212.75 >> ~/.ssh/known_hosts

      - name: Execute on VPS
        env:
          CMD: ${{ inputs.command }}
        run: ssh root@176.124.212.75 "$CMD"
