name: VPS Execute

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on VPS'
        required: true
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 176.124.212.75 >> ~/.ssh/known_hosts

      - name: Execute on VPS
        env:
          CMD: ${{ inputs.command }}
        run: ssh -i ~/.ssh/id_ed25519 root@176.124.212.75 "$CMD"
